services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: topup
      POSTGRES_DB: topup
    ports: ["5432:5432"]
    volumes: [topup_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  topup_pg: