# Manual migration workflow. Runs ONLY on manual trigger (workflow_dispatch).
# Generates an initial (or new) Prisma migration against a TEMPORARY dev
# database, then commits the SQL to the repository for review.
# It NEVER runs migrations against production, and NEVER auto-runs.
name: Generate migration (manual)

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Migration name (e.g. init)'
        required: true
        default: 'init'

permissions:
  contents: write  # needed to commit the generated migration

env:
  NODE_VERSION: "22"
  # Temporary dev DB — throwaway, NOT production.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/migrate_dev?schema=public

jobs:
  generate:
    name: Generate & commit migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: migrate_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Generate migration (dev, throwaway DB)
        run: npx prisma migrate dev --name ${{ github.event.inputs.migration_name }} --create-only
        working-directory: backend
        # --create-only: write the SQL but do NOT apply, so you can review it.

      - name: Show generated SQL (for review)
        run: |
          echo "=== Generated migration SQL ==="
          find prisma/migrations -name 'migration.sql' -newer prisma/schema.prisma -exec cat {} \; || true
        working-directory: backend

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore: add Prisma migration (${{ github.event.inputs.migration_name }})" || echo "Nothing to commit"
          git push
